[package]
name = "karcis"
version = "0.1.0"
edition = "2021"
description = "Karcis: smart pass untuk event komunitas (tiket jadi lencana + stempel) di NEAR"
repository = "https://github.com/sabnyyyyyy/soltix"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5"

[dev-dependencies]
near-sdk = { version = "5", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
